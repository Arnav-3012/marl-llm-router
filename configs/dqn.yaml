# Independent Double-DQN hyperparameters.
network:
  obs_dim: 7                      # own wait, own KV, prompt size, slack, hop count, neighbour wait, prefix hit
  hidden: [64, 64]                # MLP 7->64->64->3, ReLU
  n_actions: 3                    # Accept / Forward / Defer
gamma: 0.99                       # discount
loss: huber                       # Huber loss
optimizer: adam                   # Adam
lr: 0.001                         # learning rate (initial value; tuned on train traffic only, ADR-023)
batch_size: 64                    # minibatch size (initial value, ADR-023)
grad_clip: 10                     # gradient-norm clip
target_update: 200                # target-network sync every this many gradient steps (ADR-023)
replay:
  capacity: 50000                 # context.md range is 20k-50k
  warmup: 500                     # transitions before learning starts (ADR-023)
epsilon:
  start: 1.0                      # initial exploration
  end: 0.05                       # final exploration
  decay_steps: null               # unused: the decay is counted in episodes, see epsilon_decay_episodes
device: auto                      # mps if available, else cpu
centralised:
  enabled: false                  # centralised DQN reference (upper bound, M3)
reward_scale: 0.1                 # rewards are multiplied by this before they enter the replay buffer (keeps Q near 1; ADR-023)
epsilon_decay_episodes: 200       # episodes over which epsilon falls from start to end (ADR-023; half of the 400-episode budget, ADR-021)
learn_every: 2                    # gradient step every this many environment ticks, per agent (ADR-023)
updates_per_learn: 1              # minibatch updates per learning step
